<!DOCTYPE html>
<html>
<head><title>CORS Test</title></head>
<body>
<h2>Test CORS</h2>
<button onclick="callAPI()">Call Cross-Origin API</button>
<pre id="output"></pre>

<script>
function callAPI() {
    fetch("http://abc.com", {
        method: "POST",
        headers: {
            "Origin": "http://abc.com",
            "Content-Type": "application/json",
        },
        body: '{"refNo":"hehe"}',
    })
    .then(response => response.text())
    .then(data => {
        document.getElementById("output").innerText = data;
    })
    .catch(error => {
        document.getElementById("output").innerText = "CORS Error: " + error;
    });
}
</script>
</body>
</html>
